# 사용자 핵심 흐름. 버튼·메뉴 이름은 화면을 만든 뒤 실제 이름과 맞춘다.
platform: mobile
platformReason: 커피를 고르는 순간은 카페 계산대 앞이나 책상에서 공부하다 일어날 때다. 그 자리에서 휴대폰으로 바로 확인하고 한 번 탭으로 기록해야 하므로 모바일을 기준으로 만든다.

scenarios:
  - id: S1
    title: 처음 설정
    actor: null
    steps:
      - 앱 첫 화면을 연다
      - 잠드는 시각에서 01:00을 고른다
      - 민감도에서 "보통"을 고른다
      - "[시작하기]를 누른다"
    expected: 홈 화면에 캐릭터 말풍선 "오늘 커피는 ○시까지"가 보이고, 앱을 다시 열어도 설정한 잠드는 시각 01:00이 유지된다.
  - id: S2
    title: 마시기 전 미리 보기
    actor: null
    steps:
      - 처음 설정을 마친 홈 화면에서 [커피 마시기]를 누른다
      - 음료 목록에서 "아이스 아메리카노 라지"를 고른다
    expected: 이대로 마셨을 때의 예상 잠드는 시각과, 덜 영향을 주는 선택지 2~3개가 각각 다른 예상 잠드는 시각과 함께 보인다.
  - id: S3
    title: 덜 영향을 주는 선택지로 기록
    actor: null
    steps:
      - 처음 설정을 마친 홈 화면에서 [커피 마시기]를 누른다
      - 음료 목록에서 "아이스 아메리카노 라지"를 고른다
      - 선택지 중 "하프샷"을 고른다
      - "[이걸로 마실게]를 누른다"
    expected: 홈 화면으로 돌아오고, 오늘 기록에 하프샷이 추가되며 마지막 커피 시각이 바뀐다.
  - id: S4
    title: 기록 취소
    actor: null
    steps:
      - 처음 설정을 마친 홈 화면에서 [커피 마시기]를 누른다
      - 음료 목록에서 "아이스 아메리카노 라지"를 고른다
      - "[이걸로 마실게]를 누른다"
      - 기록 직후 나타난 [취소]를 누른다
    expected: 방금 기록이 오늘 기록에서 빠지고, 홈의 마지막 커피 시각이 기록 전 값으로 돌아간다.
  - id: S5
    title: 아침 확인
    actor: null
    steps:
      - 전날 기록이 있는 상태에서 다음 날 앱을 연다
      - '"어젯밤 잘 잤어?"에서 "뒤척임"을 고른다'
    expected: 답이 저장되고, 홈의 "오늘 커피는 ○시까지" 시각이 답하기 전보다 이른 시각으로 조정된다.
