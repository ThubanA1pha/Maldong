# 사용자 핵심 흐름. 버튼·메뉴 이름은 화면을 만든 뒤 실제 이름과 맞춘다.
# 로그인 흐름은 시드 계정 "학생"으로 시작한다. 흐름은 S1부터 같은 DB에서 차례로 돈다.
# 시드 계정: 평소 잠드는 시각 01:00, 민감도 보통, 예측보다 못 잤다는 잠 답 1번,
#   오늘 기록 "컴포즈커피 카페라떼 레귤러"(다 마심) 1건 (오늘 목록에 이 이름은 이것 하나뿐, S6이 지움),
#   어제 기록 "스타벅스 아이스 아메리카노 톨"(마신 양 확인 전) 1건 (S7의 확인 카드 "어제 스타벅스 아이스 아메리카노 톨 어땠어?"),
#   지난 5일 동안의 기록 여러 건(이미 확인 완료, 화면이 비어 보이지 않게).
# 시드 계정 "피곤한 학생"(S8): 잠드는 시각 = 시드 시각 + 2시간, 1시간 전에 메가커피 아이스 아메리카노 라지 다 마심 1건 → 언제 테스트해도 "많이 남음"에서 시작.
# 확인 카드는 오늘보다 이전 날짜의 기록에만 생기므로 S2~S5에서 만든 오늘 기록은 카드를 만들지 않는다.
platform: mobile
platformReason: |
  대상은 시험·마감 기간에 밤늦게까지 공부하는 대학생이다. 앱을 여는 순간은 이미 받은 커피를 책상에 놓고 첫 모금을 마시기 직전이거나,
  카페 앞에서 주문하기 직전이다. 두 장면 모두 손에 든 휴대폰으로 몇 번 눌러 끝나야 하므로 휴대폰 화면을 기준으로 만든다.
  제품은 휴대폰 홈 화면에 추가해 앱처럼 여는 설치형 웹앱이다.
scenarios:
  - id: S1
    title: 처음 온 학생이 가입하고 프로필을 저장한다
    steps:
      - 첫 화면에서 [시작하기]를 누른다
      - 이메일과 비밀번호를 입력하고 [가입하기]를 누른다
      - 평소 잠드는 시각에서 01:00을 고른다
      - 민감도에서 "보통"을 고른다
      - "[저장]을 누른다"
      - 화면을 새로고침한다
      - 홈에서 [프로필]을 누른다
    expected: 새로고침한 뒤에도 로그인된 상태이고, 프로필에 평소 잠드는 시각 01:00과 민감도 "보통"이 그대로 표시된다.
  - id: S2
    title: 이미 받은 커피를 마시기 직전에 확인하고 반만 마시기로 한다
    account: 학생
    steps:
      - 홈에서 [마시기 전 확인]을 누른다
      - 음료 목록에서 "메가커피 아이스 아메리카노"를 고른다
      - 사이즈에서 "라지"를 고른다
      - "[이미 음료가 있어요]를 누른다"
      - "[오늘도 01:00]을 누른다"
      - 선택지에서 [반만]을 누른다
      - "[이 양으로 마시기 시작]을 누른다"
    expected: 미리 보기에서 [반만]의 "이 음료로 01:00에 더해지는 카페인(mg)"이 [그대로]일 때의 절반(반올림 차이 1mg 이내)으로 표시되고, 캐릭터 말풍선이 오늘 이미 마신 기록까지 더해 추천 양("○○ 마시는 걸 추천해." 또는 "오늘은 여기까지")을 말한다. 기록 뒤 홈의 "오늘 커피 N잔"이 확인 전보다 하나 늘며 오늘 기록 맨 위에 "메가커피 아이스 아메리카노 라지 · 반만"이 보인다.
  - id: S3
    title: 비교해 보고 이번에는 마시지 않기로 한다
    account: 학생
    steps:
      - 홈에서 [마시기 전 확인]을 누른다
      - 음료 목록에서 "스타벅스 카페라떼"를 고른다
      - 사이즈에서 "톨"을 고른다
      - "[이미 음료가 있어요]를 누른다"
      - "[바꾸기]를 누른다"
      - 잘 시각에서 "00:00"을 고른다
      - "[이번에는 마시지 않기]를 누른다"
    expected: 미리 보기 말풍선이 "00시에 남을 양을 같이 비교해 보자."로 00:00 기준으로 다시 계산되고, [이번에는 마시지 않기]를 누르면 캐릭터가 "이번 음료는 마신 기록에 넣지 않을게."라고 말하며, 홈의 "오늘 커피 N잔" 수가 확인 전과 같다.
  - id: S4
    title: 카페 앞에서 캐릭터가 먼저 말을 걸고 하프샷으로 주문하기로 한다
    account: 학생
    steps:
      - 등록된 카페 앞에서 홈을 연다
      - 캐릭터의 "카페 앞이네?" 말풍선에서 [뭐 마실지 볼래]를 누른다
      - 음료 목록에서 "빽다방 아이스 아메리카노"를 고른다
      - 사이즈에서 "레귤러"를 고른다
      - "[오늘도 01:00]을 누른다"
      - 선택지에서 [하프샷]을 누른다
      - "[이 양으로 마시기 시작]을 누른다"
    expected: 미리 보기에서 [하프샷]의 "이 음료로 01:00에 더해지는 카페인(mg)"이 [원래대로]일 때의 절반(반올림 차이 1mg 이내)으로 표시되고, 기록 뒤 오늘 기록 맨 위에 "빽다방 아이스 아메리카노 레귤러 · 하프샷"이 보인다.
  - id: S5
    title: 이미 마신 커피를 나중에 기록한다
    account: 학생
    steps:
      - 홈에서 [이미 마신 음료 기록]을 누른다
      - 음료 목록에서 "컴포즈커피 아이스 아메리카노"를 고른다
      - 사이즈에서 "레귤러"를 고른다
      - "[기록하기]를 누른다"
    expected: 오늘 기록 맨 위에 "컴포즈커피 아이스 아메리카노 레귤러 · 다 마심"이 보이고, 홈의 "오늘 커피 N잔"이 확인 전보다 하나 는다.
  - id: S6
    title: 잘못 넣은 오늘 기록을 지운다
    account: 학생
    steps:
      - 홈에서 "오늘 커피 N잔 ›"을 누른다
      - 목록의 "컴포즈커피 카페라떼 레귤러"에서 [취소]를 누른다
      - "\"이 기록을 지울까?\"에서 [지우기]를 누른다"
    expected: 오늘 기록 목록에서 "컴포즈커피 카페라떼 레귤러"가 사라지고, 오늘 커피 잔 수가 확인 전보다 하나 줄어든다.
  - id: S7
    title: 다음에 앱을 열어 어제 커피와 잠을 알려 주고 민감도가 바뀐다
    account: 학생
    steps:
      - 홈의 "어제 스타벅스 아이스 아메리카노 톨 어땠어?" 카드에서 [답하기]를 누른다
      - "\"아까 커피 얼마나 마셨어?\"에서 [다]를 누른다"
      - "\"잘 잤어?\"에서 [뒤척임]을 누른다"
      - 홈에서 [프로필]을 누른다
    expected: 답한 직후 캐릭터가 "요즘 커피에 좀 예민한 것 같아. 앞으로 민감한 편으로 계산할게."라고 말하고, 프로필의 민감도가 "민감한 편"으로 표시된다.
  - id: S8
    title: 많이 마신 날 카페 앞에서 캐릭터가 먼저 말을 걸고 디카페인으로 주문하기로 한다
    account: 피곤한 학생
    steps:
      - 등록된 카페 앞에서 홈을 연다
      - "\"카페 앞이네? 또 마시는 거야…?\" 말풍선에서 [뭐 마실지 볼래]를 누른다"
      - 음료 목록에서 "스타벅스 아이스 아메리카노"를 고른다
      - 사이즈에서 "톨"을 고른다
      - "[오늘도 …]를 누른다"
      - 선택지에서 [디카페인]을 누른다
      - "[이 양으로 마시기 시작]을 누른다"
    expected: 미리 보기에서 [디카페인]의 "이 음료로 잘 시각에 더해지는 카페인(mg)"이 [원래대로]보다 적게 표시되고, 기록 뒤 오늘 기록 맨 위에 "스타벅스 아이스 아메리카노 톨 · 디카페인"이 보인다.
