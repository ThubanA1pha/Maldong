# 문제정의 캔버스 최종안 v4 (앞면 + 뒷면). 사람이 읽는 전문은 docs/problem_canvas.md.
# 키는 대회 키트 problem.example.yaml 형식을 따른다.
# 표시: [실제 경험] 팀원이 직접 겪음 / [출처] 링크를 열어 확인함 / [추정] 본인 기억에 의존한 값 / [미기록] 기록하지 않아 모름 / [가설] 아직 검증하지 않음

statement: 시험·과제 마감이 겹치는 기간에 늦게까지 공부하며 저녁에도 커피를 마시는 대학생은, 커피를 마시기 직전 그 한 잔이 잘 시간까지 몸에 얼마나 남아 잠에 영향을 줄지, 깨어 있으면서도 덜 영향을 주는 선택지가 무엇인지 알 수 없기 때문에, 잠에 영향이 있다는 걸 알면서도 그대로 마시고 늦게 잠들어 다음 날 수업과 컨디션을 잃는다. 지금은 "저녁엔 안 마시기", "하루 200mg까지" 같은 스스로 정한 규칙이나 카페인 기록 앱으로 버티지만, 규칙은 마감이 몰리면 무너지고 그날 이미 마신 양을 반영하지 못하며, 기록 앱은 음료를 추가한 뒤에야 예측이 바뀌어 마시기 직전에는 도움이 덜 된다는 단점이 남는다.
canvas:
  context: '시험이나 과제 마감 기간, 학교나 집에서 밤늦게까지 공부할 때 일어난다. 팀원 두 명 모두 저녁 7~9시에 아메리카노를 마시고 새벽 1~3시에 누웠지만, 한두 시간이 지나서야 잠든 것 같다고 회상했다 [실제 경험: E1·E2, 잠든 시각은 추정]. 다음 날 피곤한 채로 다시 커피를 찾고, 그 커피가 또 그날 밤 잠을 늦추는 일이 반복된다. 대학생은 학기마다 중간·기말 두 번 시험 기간을 맞고, 그 사이에도 과제 마감이 몰리는 주가 있다. 팀원 A는 2026년 2학기 중간고사 기간 7일 내내 저녁 커피를 마시고 늦게 잠들었고, 다음 날 피곤한 채로 다시 커피를 마셨다 [실제 경험: E1]. 아이폰 스크린타임에서 7일 모두 새벽 1~2시 이후 휴대폰 사용이 없고 다음 날 오전 7시 30분에 다시 사용이 시작된 기록을 보고 확인했다(휴대폰을 내려놓은 시각이며 실제로 잠든 시각은 아니다). B도 10월 23일 마감 전날이 있던 그 마감 주에 일주일 내내 저녁 커피를 마시고 늦게 잠들었다고 답했다 [실제 경험: E2]. 작업 기록에 마지막 작업 시각이 매일 새벽 3시 이후로 찍혀 있고 그 뒤로는 작업이 없다(작업을 마친 시각일 뿐 잠든 시각은 아니다).'
  customer: |-
    시험·과제 마감이 겹치는 기간에 늦게까지 공부하며 저녁에도 커피를 마시는 대학생.
    이 범위를 고른 이유: 팀원 두 명이 실제로 겪은 상황이고 [실제 경험], 커피를 마실지 본인이 직접 정하며, 시험·마감처럼 문제가 생기는 때가 분명하다.
    이번에 다루지 않는 경계:
    - 밤을 새우기로 정한 날: 잠을 지키는 것이 목적이 아니다. (잘 계획이 있었는데 늦게 잠든 경우는 포함한다.)
    - 야근·교대 근무 직장인: 근무 일정과 회사 환경이 달라 따로 확인해야 한다.
    - 청소년: 권장 섭취량과 보호자·학교 환경이 다르다.
    - 임신 중이거나 카페인 관련 질환이 있는 사람: 의료적 판단이 필요하다.
    - 잠을 못 이루는 이유가 스트레스나 수면 장애처럼 카페인이 아닌 경우.
  root_problem: |-
    1. 잠에 영향이 있다는 건 알지만, 얼마나인지는 모른다. 팀원 A는 마시면서 "지금 먹으면 잠 못 잘 텐데"라고 생각했고, 팀원 B는 저녁에는 커피 대신 물을 마시려고 했다. 둘 다 영향은 알았지만, 그 한 잔이 몇 시까지 잠을 막을지는 몰랐다 [실제 경험].
    2. 당장 해야 할 일이 잠보다 급하다. A는 시험("잠이라도 깎아서 공부해야지"), B는 프로젝트 마감 때문에 깨어 있어야 했고, 결국 마셨다 [실제 경험]. 그래서 "마시지 마라"는 규칙이나 일반적인 정보만으로는 선택이 잘 바뀌지 않는다 [가설].
    3. 마신 양을 정확히 모른다. 카페에서 파는 커피는 컵에 카페인 양이 적혀 있지 않은 경우가 많고, 같은 아메리카노라도 매장과 샷 수에 따라 양이 다르다. 팀원 A는 메뉴의 샷 수를 보고 세지만, 샷 한 개의 양이 매장마다 달라 정확하지 않다 [실제 경험]. 편의점 라떼를 마시고 새벽까지 못 잔 뒤, 나중에 카페인 양(274mg)을 찾아보고 놀랐다는 글도 있다 [출처: 클리앙 2024-08].
    4. 잠이 줄어도 본인은 잘 알아차리지 못한다. 잠들기 6시간 전에 카페인 400mg을 먹은 실험에서, 기계로 잰 수면은 1시간 넘게 줄었지만 본인이 적은 수면 기록에는 큰 차이가 없었다 [출처: Drake 2013, 성인 12명]. 그래서 다음 날 피곤해도 원인을 커피보다 공부량이나 컨디션에서 찾기 쉽다 [가설].
    5. 카페인이 몸에서 빠지는 속도는 사람마다 크게 다르다. 건강한 성인의 반감기는 평균 약 4시간이지만 2~8시간까지 차이가 난다 [출처: EFSA 2015]. 흡연자는 평균 3.5시간으로 비흡연자(6.0시간)보다 빠르고 [출처: Parsons·Neims 1978], 경구피임약을 먹는 여성은 10.7시간으로 먹지 않는 여성(6.2시간)보다 느리다 [출처: Patwardhan 1980]. 유전도 영향을 준다 [출처: Nehlig 2018]. 같은 시각, 같은 커피라도 사람마다 영향이 다르다.
    개입 지점: 커피를 마시기 직전. 두 장면이 있다. 이미 커피를 받아 든 때에는 마실 양만 바꿀 수 있다(E1: 잠을 설친 다음 날 피곤한 채로 다시 커피를 들고 마시며 "하, 지금 먹으면 또 잠 못 잘 텐데"라고 생각했다). 아직 주문하기 전에는 사이즈·샷·디카페인까지 바꿀 수 있다(E2: 마시기 전에 구체적으로 알려 주면 대체제를 찾겠다고 답했다). 두 장면 중 어느 쪽이 더 잦은지는 세어 보지 않았다 [미기록].

    왜 아직 아무도 고치지 못했나요?
    - 스스로 정한 시각 규칙(A "오후 6시 이후엔 안 마신다", B "저녁엔 커피 대신 물"): 마감이 몰리면 무너졌다. A는 시험 기간 오후 9시에, B는 마감 전날 오후 7시에 마셨다 [실제 경험]. 정해 둔 시각만 보기 때문에 그날 이미 마신 양은 반영하지 못한다.
    - 하루 총량 규칙(A "하루 200mg 이상 안 마신다"): 총량만 보면 늦게 마신 한 잔의 영향을 놓친다. A는 메뉴의 샷 수를 보고 세지만, 샷 한 개의 카페인은 매장마다 다르다 [실제 경험].
    - 커피 끊기: 매일 마시던 사람이 끊으면 실험 연구에서 50%가 두통을 겪었고, 13%는 일상에 지장을 줄 만큼 힘들어했다 [출처: Juliano·Griffiths 2004].
    - 카페인 기록 앱(예: HiCoffee): 팀원이 2026-10-29 직접 써 보니, 잘 때 남는 카페인 기준(기본 100mg), 하루 한도, 반감기 수정, 애플 건강 앱 수면 연동, 덜 영향을 주는 선택지 제안까지 이미 있었다. 하지만 음료를 추가해야만 예측이 바뀌었고(추가했다 지우면 미리 볼 수는 있지만 번거롭다), 국내 카페 메뉴가 없어 함량을 직접 입력해야 했으며, 결과가 "113mg, Low" 같은 영어 숫자·그래프라 오늘 잠에 어떤 의미인지 바로 이해하지 못했다 [실제 경험: E3]. 개인 한도와 대사율 추정은 유료다.
    - 다른 카페인 앱(Caffeine Clock): 음료 목록이 미국 중심이라 아이스 아메리카노가 없다는 리뷰가 있다 [출처: Google Play, 팀원 확인].
    - 수면 앱: 어젯밤 잠을 기록해 보여 주지만, 어느 커피가 영향을 줬는지나 오늘 무엇을 마실지는 다루지 않는다 [가설: 직접 사용 비교 전].
  impact:
    feeling: |-
      팀원 A: "하, 지금 먹으면 또 잠 못 잘 텐데." (잠을 설친 다음 날, 다시 커피를 마시며) 정신이 드는 건 좋았지만, 커피를 계속 달고 살아야 할 것 같은 불안감이 들었다 [실제 경험].
      팀원 B: "그냥 저녁에 커피 마시지 말고 버틸걸." (다음 날 아침 수업을 놓친 뒤) [실제 경험]
    measurable: |-
      잠들기까지 걸린 시간: A는 새벽 1시에 누워 2시쯤 잠듦(약 1시간), B는 새벽 3시에 누워 4시 30분쯤 잠듦(약 1시간 30분, 계속 뒤척임) [추정].
      다음 날 잃은 것: B는 아침 수업 1개를 놓쳤다 [실제 경험]. 빈도: B는 같은 마감 주에 일주일 내내 늦게 잠들었다고 답했고, 작업 기록의 마지막 작업 시각이 매일 새벽 3시 이후다 [실제 경험: E2]. A는 잔 것 같지 않게 피곤해 낮에 졸거나 낮잠을 잤다(낮잠 횟수 [미기록]). 빈도: A는 중간고사 기간 7일 내내 이 악순환을 겪었다고 답했다 [실제 경험: E1]. 아이폰 스크린타임에서 7일 모두 새벽 1~2시까지 휴대폰을 썼고 다음 날 7시 30분에 다시 쓴 기록이 이를 뒷받침한다(휴대폰 사용 기록일 뿐 잠든 시각은 아니다).
      참고: 여러 연구를 모은 분석에서 카페인은 총 수면 시간을 평균 약 45분 줄였다 [출처: Gardiner 2023]. 평균값이며 팀원 개인의 손실을 잰 것은 아니다.
  alternatives:
  - how_used: 겪어 보고 감으로 정한 시각 규칙을 지킨다. 팀원 A는 "오후 6시 이후엔 안 마신다", 팀원 B는 "저녁엔 커피 대신 물을 마신다" [실제 경험].
    shortcoming: 마감이 몰리면 무너졌다. A는 시험 기간 오후 9시에, B는 오후 7시에 마셨다 [실제 경험]. 감으로 정한 시각이라 내 몸에 맞는지, 그날 이미 마신 양까지 고려했는지 알 수 없다.
    why_ours: '팀원 B: "(마시기 전에 지금 마시면 새벽 몇 시쯤 잠들 것 같다고) 그렇게 말해준다면 커피 대신에 대체제를 찾아볼 거 같다." [실제 경험]'
  - how_used: 하루 총량을 정해 넘지 않으려 한다. 팀원 A는 "하루 200mg 이상 안 마신다". 200mg은 권장량이라고 알고 있던 숫자이고, 카페 메뉴의 샷 수를 보고 직접 센다 [실제 경험].
    shortcoming: 총량만 보면 늦게 마신 한 잔의 영향을 놓친다. 카페 음료는 함량이 적혀 있지 않은 경우가 많고, 샷 수로 세더라도 샷 한 개의 카페인이 매장마다 달라 정확히 세기 어렵다.
    why_ours: '팀원 A: "나한테 남아 있는 카페인을 귀여운 펫으로 보여 줘서 내 몸 상태를 눈에 보이게 해 주고, 카페인을 마시기 전에 먼저 한 번 멈칫하게 해 주고, 나를 인지시켜 주는 게 좋다." [실제 경험]'
  - how_used: '카페인 기록 앱에 마실 때마다 기록하고, 잠잘 때 남을 카페인 예측을 확인한다. 팀원이 2026-10-29 iPhone에서 HiCoffee를 직접 써 봤다: 오후 2시에 아메리카노 X-Large(300mg)를 기록하고 오후 7시 40분에 화면을 확인했다 [실제 경험: E3].'
    shortcoming: '음료를 추가해야만 남을 카페인 예측이 바뀐다. 국내 카페 메뉴가 없어 함량을 직접 입력해야 한다. 결과가 "113mg, Low" 같은 영어 숫자와 그래프라 오늘 잠에 어떤 의미인지 바로 이해하지 못했다 [실제 경험: E3]. 개인 한도·대사율 추정은 유료다. (잘 때 기준선, 반감기 수정, 선택지 제안은 이미 잘 되어 있다.)'
    why_ours: '팀원이 HiCoffee를 직접 써 보니, 음료를 추가해야만 남을 카페인 예측이 바뀌었고 국내 카페 메뉴가 없어 함량을 직접 입력해야 했다. 결과는 "113mg, Low" 같은 숫자와 그래프여서 오늘 잠에 어떤 의미인지 바로 이해하지 못했다 [실제 경험: E3]. 우리는 기록하기 전, 마시기 직전에 국내 메뉴 함량으로 계산한 결과를 한국어 한 줄로 보여 준다.'
