  when: 2026년 2학기 중간고사 기간 / 팀원 A (대학생)
  what_happened: 시험 공부를 하던 날 오후 9시쯤 아이스 아메리카노를 마셨다(매장·크기 [미기록]). 새벽 1시에 누웠지만 깨어 있다가 2시쯤 잠든 것 같다 [추정]. 다음 날 잔 것 같지 않게 피곤했고, 피곤한 채로 다시 커피를 들고 수업에 갔다. 마시면서 "하, 지금 먹으면 또 잠 못 잘 텐데"라고 생각했다. 낮에 졸거나 낮잠을 자야 했다.
  workaround: 평소에는 "오후 6시 이후엔 안 마신다"(감으로 정함), "하루 200mg 이상 안 마신다"(권장량이라고 알고 있던 숫자, 메뉴의 샷 수로 셈)를 지킨다. 그날은 "내일 시험인데 공부를 아직 덜 한 것 같아 마저 해야 했다. 커피가 없으면 졸려서 늦게까지 못 할 것 같았다. 잠이라도 깎아서 공부해야지" 하며 규칙을 깼다. 잠을 줄이는 것은 알고 고른 선택이었지만, 얼마나 줄어들지는 몰랐다.
  feeling: 정신이 드는 건 좋았지만, 커피를 계속 달고 살아야 할 것 같은 불안감이 들었다.
  quote: 하, 지금 먹으면 또 잠 못 잘 텐데. / 잠이라도 깎아서 공부해야지.
  source: 팀원 A 본인 경험. 같은 시험 기간 7일 내내 반복된 것은 아이폰 스크린타임(새벽 1~2시 이후 사용 없음, 다음 날 7시 30분 사용 시작)으로 확인
