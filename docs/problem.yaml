# 팀 종이 문제정의 캔버스(앞면)를 옮긴 파일입니다.
# 종이에 없는 칸은 null 또는 []로 남겼습니다.

statement: |-
  시험과 과제가 몰리는 기간에 커피로 버티는 대학생은, 학교나 집에서 공부하며 마신 커피가 잘 때까지 몸에 얼마나 남아 잠에 영향을 줄지 알 수 없기 때문에, 밤에 깊이 못 자고 다음 날 더 피곤해져 또 커피를 찾는 악순환을 겪는다. 지금은 "오후 3시 이후엔 디카페인", "하루 두 잔까지" 같은 규칙을 정하거나 카페인 기록 앱을 쓰며 버티지만, 규칙은 사람마다 다른 카페인 반응을 반영하지 못하고, 기록 앱은 숫자만 보여 줄 뿐 지금 내가 어떻게 해야 하는지는 알려 주지 않는다는 단점이 남는다.
canvas:
  context: |-
    시험기간이나 과제가 많은 시기에 대학생이 학교나 집에서 공부할 때 자주 일어난다. 피곤함을 느끼지 않고 집중하기 위해 카페인을 마시지만, 잠을 자야 할 때 잠들지 못해 다음 날에도 피로를 느끼게 된다. 이때 다시 카페인을 마시게 되면 충분히 쉬지 못한 채 카페인에 의존하는 생활이 반복되고, 결국 피로가 지속되는 악순환이 생기게 된다.
  customer: |-
    중학생부터 대학생: 학기 당 각각 2번(중간/기말)의 시험을 보게 되는데 그 때마다 늦게 자고, 일찍 일어나고, 커피나 에너지 드링크 등의 고카페인 음료를 마시게 됨으로 카페인의 과다복용과 불규칙한 생활패턴의 반복으로 지속적인 피로를 느끼게 된다
    성인: 야근 또는 늦은 퇴근으로 인한 업무 시간의 연장으로 인해 카페인을 복용하게 되고 다음날 출근은 늦지 않게 해야 하기 때문에 카페인을 복용하게 된다
    공통: 위와 같은 상황으로 개인의 여가시간이 줄어들어 그것을 만회하기 위해 늦은 시간까지 여가시간을 즐기기 위해 카페인을 복용하게 된다
  root_problem: |-
    1. 피곤해서 커피를 마시고, 그래서 밤에 잘 못 자고, 다음 날 더 피곤해서 또 마시는 일이 반복된다. 시험 기간처럼 매일 버텨야 하는 때에는 이 반복을 끊기가 더 어렵다.
    2. 카페인은 마시고 몇 시간이 지나도 몸에 남아 있다. 그래서 오후 4~5시쯤 마신 커피가 밤 11~12시 잠자리에 들 때까지 남아 잠을 방해한다. 마신 시간과 잠을 못 자는 시간이 많이 떨어져 있다보니, 그 커피 때문이라고 생각하기 어렵다.
    3. 내가 마신 커피에 카페인이 얼마나 들었는지부터 잘 모른다. 같은 아메리카노라도 카페나 샷에 따라 카페인 양이 크게 다르고, 컵에 적혀있지 않은경우가 있다(카페형) 커뮤니티에도 나중에 카페인 양을 찾아보고 놀랐다는 글이 자주 보인다. 얼마나 마셨는지 모르니, 지금 몸에 얼마나 남았는지도 알 수 없다.
    4. 실질적인 질 좋은 수면시간을 취하지 못했음을 인지하지 못해 건강을 챙기지 못하게 된다.
    5. 카페인이 몸에서 빠지는 속도가 사람마다 다르다. 보통 4~5시간이면 절반이 빠지지만, 사람에 따라 2시간 만에 빠지기도 하고 8시간 넘게 걸리기도 한다. 담배를 피우는지, 피임약을 먹는지 같은 것에 따라서도 달라진다. 그래서 같은 시간에 같은 커피를 마셔도 누구는 잘 자고 누구는 못 잔다.

    왜 아직 아무도 고치지 못했나요?
    - 커피 끊기, 디카페인으로 바꾸기: "커피 없이는 못 버틴다", "끊으려다 실패했다"는 글이 가장 많았고, 실패 이유로 두통이 자주 나왔다. 매일 마시던 사람이 갑자기 끊으면 절반 정도가 두통을 겪는다는 연구도 있다(Juliano & Griffiths, 2004). 디카페인도 결국 원래 커피로 돌아간다
    - "오후 몇 시 이후엔 마시지 않기" 같은 일반 기준: 사람마다 카페인이 빠지는 속도가 달라서, 누구에게는 너무 엄격하고 누구에게는 부족하다. 시험 기간처럼 바쁠 때는 쉽게 무너진다
    - 카페인 기록 앱: 기록하면 숫자와 그래프는 보여 주지만, 지금 더 마셔도 되는지, 오늘 밤 잠은 괜찮은지는 사용자가 직접 판단해야 한다. 묻지 않으면 먼저 알려 주지도 않는다
    - 수면 앱: 어젯밤에 잘 잤는지만 보여 주고, 어떤 커피가 문제였는지는 알려 주지 않는다
  impact:
    feeling: |-
      한 말: "아.. 이거 끝내야하는데 이대로 자면 다 마무리할 수 없는데.. 피곤하다."
      기분: 할 일은 많이 남아있는데 몸이 따라와주지 않는 피로감과 압박감
    measurable: |-
      시간: 피로 회복과 수면에 필요한 휴식 시간
      횟수: 몸에 나타나는 악신호를 무시하고 카페인으로 버티는 악순환 반복
      기회: 최상의 컨디션으로 일의 효율을 높이고 장기적으로는 몸의 건강을 지킬 기회
  alternatives:
    - how_used: 오후에 커피가 당기면 시간을 확인하고, '오후 3시 이후에는 일반 커피를 마시지 않는다'는 규칙에 따라 디카페인으로 바꿔 주문한다.
      shortcoming: 정해 둔 시각만 기준으로 삼기 때문에, 그날 이미 마신 양과 잠들 예정인 시간을 반영하기 어렵다. 디카페인으로 바꾸더라도 오늘의 섭취가 밤잠에 얼마나 영향을 줄지는 판단하기 어렵다.
      why_ours: null
    - how_used: 오늘 마신 커피 잔 수를 머릿속으로 세고, 스스로 정한 '하루 두 잔'을 넘으면 더 마시지 않고 참는다.
      shortcoming: 같은 한 잔이라도 음료 종류와 크기에 따라 카페인 양이 달라, 잔 수만으로 실제 섭취량을 판단하기 어렵다. 두 잔 이내라도 늦게 마셨을 때의 영향은 놓칠 수 있다.
      why_ours: null
