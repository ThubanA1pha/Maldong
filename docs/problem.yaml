five_whys:
  symptom: 시험·마감 기간에 저녁 커피를 마신 날 늦게 잠들고, 다음 날 피곤해서 다시 커피를 찾는다.
  whys:
  - 왜 다음 날 피곤했나? 늦게 잠들었다. A는 새벽 2시, B는 4시 30분쯤 [추정].
  - 왜 늦게 잠들었나? 저녁 7~9시에 마신 커피가 잘 시간까지 남아 있었을 가능성이 크다. 두 사람 모두 커피가 영향을 주었을 것으로 생각했다 [실제 경험]. 다만 마감 긴장 같은 다른 요인은 배제하지 못했다 [가설].
  - 왜 저녁에 커피를 마셨나? 시험과 마감 때문에 늦게까지 깨어 있어야 했다 [실제 경험].
  - 왜 잠에 영향이 있다는 걸 알면서도 그대로 마셨나? 영향이 있다는 건 알았지만 얼마나인지는 몰랐고, 깨어 있으면서도 영향을 줄일 다른 선택지를 그 순간 떠올리지 못했다. B는 구체적으로 알려 주면 대체제를 찾아보겠다고 답했다 [실제 경험].
  - '왜 그 순간에 알 수 없었나? 카페 음료는 카페인 양이 잘 보이지 않고 [출처: 클리앙], 영향은 몇 시간 뒤에야 나타나며 본인도 잘 알아차리지 못하고 [출처: Drake 2013], 카페인이 빠지는 속도도 사람마다 달라 [출처: EFSA 2015, Nehlig 2018] 감으로 계산할 수 없다.'
solution_paths:
- path: 커피를 마시기 직전 판단을 돕는다
  status: chosen
  reason: |-
    마시기 직전, 기록하기 전에 그 한 잔을 마셨을 때 오늘 잘 시각에 몸에 남을 카페인과 덜 영향을 주는 선택지를 캐릭터의 표정과 한국어 한 줄로 먼저 보여 주고, 고른 양만 기록한다.
    왜 이 경로인가: 두 팀원 모두 잠에 영향이 있다는 걸 알면서도 마셨고(E1·E2), B는 마시기 전에 구체적으로 알려 주면 대체제를 찾겠다고 답했다(E2). 지난 기록을 돌아보는 경로(선택하지 않음)로는 그 순간의 선택이 바뀌지 않으므로, 마시기 직전을 고른다.
    대안보다 나은 조건:
    - 시각·총량 규칙과 달리 그날 이미 마신 양과 오늘 잘 시각을 반영한다. 두 팀원의 규칙은 마감 앞에서 무너졌다(E1·E2).
    - 기록 앱(HiCoffee)과 달리 음료를 추가하지 않아도 미리 비교할 수 있고, 국내 카페 메뉴 함량으로 계산하며, 결과를 영어 숫자·그래프가 아닌 한국어 한 줄로 보여 준다(E3).
    - 커피를 끊게 하지 않으므로 금단 부담이 없다(R3). 깨어 있어야 하는 상황은 그대로 인정한다.
    실행 가능성: 남은 양은 공개된 반감기 공식(마신 양 × 0.5^(지난 시간 ÷ 반감기))으로 계산하고, 민감도 3단계에 문헌의 반감기 값(R8·R9)을 대응시킨다. HiCoffee도 같은 공식을 쓴다(E3). 기준 수치와 화면 동작은 features에 적는다.
    알려진 한계:
    - 카페인이 빠지는 속도는 정확히 알 수 없다. 민감도와 확인 질문으로 추정할 뿐이다.
    - 함량이 공개되지 않은 메뉴는 넣지 않는다. 그래서 선택지는 데이터에 있는 메뉴로만 보인다. 디카페인은 공식 함량이 공개된 스타벅스 1종뿐이라 다른 브랜드에서는 [디카페인]이 보이지 않고, [하프샷]은 공개 함량의 절반으로 계산한 값이다.
    - 의학적 판단이나 진단은 하지 않는다.
    - 알려 줘도 그대로 마시는 사람은 바꾸지 못할 수 있다.
    - 앱을 열지 않으면 개입할 수 없다. 카페 앞 알림도 앱이 열려 있을 때만 동작한다.
- path: 섭취와 수면·피로를 기록하고 돌아본다
  status: rejected
  reason: E1·E2 모두 커피가 잠에 영향을 주었을 것으로 생각했다 [실제 경험]. 지난 기록을 돌아보는 것만으로는 마감 앞에서 커피를 마시기 직전의 선택이 바뀌지 않는다. 수면·피로까지 매일 기록하게 하면 입력 부담이 기존 기록 앱보다 커진다.
insight:
  claim: 학생들은 커피가 잠을 방해한다는 것을 이미 알고 있다. 문제는 몰라서가 아니라, 마감 때문에 깨어 있어야 하는 그 순간에 "얼마나 영향이 있는지"와 "대신 무엇을 고를 수 있는지"를 구체적으로 알 수 없어서 그대로 마신다는 점이다.
  evidence: |-
    - 팀원 두 명 모두 잠에 영향이 있다는 걸 알면서도 시험·마감 때문에 저녁 7~9시에 마셨고, 누운 뒤 잠들기까지 약 1~1.5시간 걸렸다고 회상했다 [실제 경험: E1·E2].
    - 미국 대학생 1,248명 조사에서 카페인을 마시는 이유로 각성 유지 79%, 집중력 향상 31% [출처: Mahoney 2019].
    - 카페인은 총 수면 시간을 평균 약 45분 줄이고 잠드는 시간을 약 9분 늘렸다. 커피 한 잔(107mg)은 잠들기 8.8시간 전까지 마시라고 권했다 [출처: Gardiner 2023].
    - 잠들기 6시간 전 카페인 400mg에도 기계로 잰 수면은 1시간 넘게 줄었지만, 본인 기록에서는 큰 차이가 없었다 [출처: Drake 2013].
    - 매일 마시던 사람이 끊으면 실험 연구에서 50%가 두통을 겪었다 [출처: Juliano·Griffiths 2004].
    - 카페인 반감기는 평균 약 4시간, 2~8시간까지 차이가 난다 [출처: EFSA 2015]. 대사는 유전·흡연·약물에 따라 다르다 [출처: Nehlig 2018, Parsons·Neims 1978, Patwardhan 1980].
    - 팀원이 HiCoffee를 직접 써 보니 결과가 영어 숫자와 그래프라 의미를 바로 이해하지 못했다 [실제 경험: E3].
    이 근거들은 문제가 생길 가능성과 중요성을 뒷받침하지만, 한국 대학생에서 이 악순환이 얼마나 자주 일어나는지, 우리 해법이 실제로 잠을 지켜 주는지까지 입증한 것은 아니다.
  design_decision: |-
    1. 관찰: E1·E2 모두 영향을 알면서도 마감 때문에 마셨다 → 의미: 금지나 경고만으로는 선택이 잘 바뀌지 않는다 → 결정: 금지 대신 깨어 있으면서 덜 영향을 주는 선택지와 각 선택지를 마셨을 때 잘 시간에 남을 카페인을 한국어 한 줄로 보여 준다. 커피를 끊게 하는 기능은 만들지 않는다 → 모르는 점: 선택지를 보여 주면 실제로 바꿔 고르는지 → 재검토 조건: 사용 테스트에서 선택지를 거의 고르지 않으면 다음 날 회복 제안으로 무게를 옮긴다.
    2. 관찰: A의 "6시 이후 금지"·"200mg" 규칙과 B의 "저녁엔 물" 규칙이 마감 앞에서 무너졌다 → 의미: 고정 규칙은 그날의 상황을 반영하지 못하고 압박에 약하다 → 결정: 모두에게 같은 기준을 적용하는 기능은 만들지 않는다. 그날 마신 양과 잠드는 시각, 민감도로 매번 다시 계산한다 → 모르는 점: 민감도 3단계와 확인 질문으로 개인차를 충분히 맞출 수 있는지 → 재검토 조건: 확인 질문 결과와 예측이 자주 어긋나면 민감도 질문을 보완한다.
    3. 관찰: 팀원이 HiCoffee를 직접 써 보니 음료를 추가해야만 예측이 바뀌었고, 국내 메뉴가 없었으며, 영어 숫자·그래프를 바로 이해하지 못했다 [E3]. 카페 음료는 함량을 모르기 쉽다 → 의미: 마시기 직전에 바로 보여야 하고, 입력이 귀찮으면 쓰지 않는다 → 결정: 비교는 기록 없이 먼저 보여 주고, [이 양으로 마시기 시작]을 눌러야 기록한다. 국내 카페 4곳(메가커피, 컴포즈커피, 빽다방, 스타벅스)의 아메리카노·라떼 공개 함량을 미리 넣는다. 결과는 캐릭터 표정과 한국어 한 줄로 먼저 보여 주고, mg 숫자는 선택지끼리 비교할 때만 보조로 함께 적는다. 실제로 마신 양과 잠은 다음에 앱을 열 때 확인 질문 한 화면으로 묻는다. 잘못 넣은 오늘 기록은 남는 양 계산을 틀리게 하므로 지울 수 있게 한다 → 모르는 점: 대학생이 며칠 이상 계속 기록하는지 → 재검토 조건: 첫 사용 테스트에서 기록을 자주 빠뜨리면 입력 항목을 더 줄인다.
    4. 관찰: 팀원 A는 잠을 설친 다음 날 피곤한 채로 다시 커피를 들고 마시며 "하, 지금 먹으면 또 잠 못 잘 텐데"라고 생각했다(E1). 이미 받은 커피는 하프샷으로 바꿀 수 없다 → 의미: 선택지는 지금 실제로 할 수 있는 것이어야 한다 → 결정: [이미 음료가 있어요]면 마실 양(그대로 / 반만 / 3분의 1만 / 이번에는 마시지 않기)을, [아직 바꿀 수 있어요]면 주문(원래대로 / 작은 사이즈 / 하프샷 / 디카페인)을 비교한다 → 모르는 점: 이미 받은 커피의 양을 실제로 줄이는지 → 재검토 조건: 확인 질문에서 추천 양보다 늘 더 마셨다고 답하면 문구와 선택지를 다시 본다.
    5. 관찰: A는 잠을 설친 다음 날 피곤한 채로 또 커피를 마시면서 "또 잠 못 잘 텐데"라고 망설였고(E1), "카페인을 마시기 전에 먼저 한 번 멈칫하게 해 주는 게 좋다"고 말했다(대안 A2의 why_ours). B는 마시기 전에 알려 주면 대체제를 찾겠다고 했고(E2), 대체제(작은 사이즈·하프샷·디카페인)는 주문하기 전에만 고를 수 있다 → 의미: 몸에 남은 카페인이 이미 많은데 또 마시려는 순간이 가장 멈칫해야 할 때이고, 주문 전에 알릴수록 고를 수 있는 선택지가 많다. 그런데 앱은 사용자가 열어야만 개입할 수 있다(한계) → 결정: 앱이 열려 있을 때 앱에 미리 넣은 카페 매장의 50m 안에 들어오면 캐릭터가 "카페 앞이네?"라고 먼저 말을 걸어 주문 전 비교로 이끈다. 오늘 잘 때 남을 카페인이 이미 "많이 남음"이면 "또 마시는 거야…?"라고 먼저 말한다. 앱이 닫혀 있을 때의 위치 추적과 푸시 알림은 하지 않는다. 이미 받아 든 경우(E1)는 [마시기 전 확인]의 [이미 음료가 있어요]가 맡고, 카페 앞 알림은 아직 주문을 바꿀 수 있는 경우(E2)를 위한 보조 경로다 → 모르는 점: 학생이 카페 앞에서 앱을 열어 두는지, 먼저 말을 걸면 실제로 주문을 바꾸는지 [가설] → 재검토 조건: 사용 테스트에서 카페 앞 말풍선을 눌러 비교로 들어가는 일이 거의 없으면 이 기능을 빼고 홈의 [마시기 전 확인]만 남긴다.
    6. 관찰: 확인 질문은 어제 기록과 잠 답을 날짜를 넘어 이어 붙여야 민감도를 맞출 수 있다. 기록에는 언제 무엇을 얼마나 마셨는지와 잠을 어떻게 잤는지가 담기고, 민감도는 사람마다 따로 맞춰진다 → 의미: 기록과 민감도가 기기나 브라우저가 바뀌어도 이어져야 하고, 본인만 볼 수 있어야 한다 → 결정: 이메일·비밀번호 계정으로 기록과 민감도를 사람마다 따로 저장하고, 서버는 요청한 사람의 기록만 읽고 바꾼다. 이름·전화번호 같은 다른 개인정보는 받지 않는다 → 모르는 점: 처음 쓰는 학생이 가입 단계 때문에 그만두는지 → 재검토 조건: 사용 테스트에서 가입 단계에서 그만두는 사람이 많으면 가입 없이 먼저 써 보게 하는 방식을 검토한다.
    7. 관찰: B는 "지금 마시면 새벽 몇 시쯤 잠들 것 같다"고 알려 주면 대체제를 찾겠다고 했다(E2). 그러나 반감기는 사람마다 2~8시간까지 차이가 나고(R8), 잠드는 시각은 마감 긴장처럼 카페인 밖의 요인에도 달려 있다(5 Whys 2단계) → 의미: 잠드는 시각을 시각 단위로 맞히겠다고 약속하면 틀릴 가능성이 크다 → 결정: 잠드는 시각 대신 오늘 잘 시각에 몸에 남을 카페인을 세 단계(거의 영향 없음 / 조금 늦게 잠들 수 있음 / 많이 남음)와 한국어 한 줄로 보여 준다. 확인 질문에서는 이 단계와 실제 잠을 비교한다. 그 기록의 단계가 "많이 남음"이 아니었는데 [뒤척임]·[거의 못 잠]이면 예측보다 못 잔 것, "많이 남음"이었는데 [푹]이면 예측보다 잘 잔 것으로 본다 → 모르는 점: 시각 대신 단계로 보여 줘도 B처럼 대체제를 찾는지, 그리고 본인의 잠 답은 실제 수면과 어긋날 수 있고(R4) 마감 긴장처럼 카페인이 아닌 이유로 못 잔 밤도 섞인다는 점. 그래서 한 번의 답으로는 바꾸지 않고 같은 방향이 2번 쌓일 때만 민감도를 한 단계 옮긴다 → 재검토 조건: 사용 테스트에서 단계 표시를 보고도 선택이 바뀌지 않으면 잠드는 시각의 범위 표시를 검토한다.
    전달 방식: 결과는 숫자나 그래프 대신 캐릭터의 짧은 말풍선 한 줄로 보여 준다(예: "01시에 남을 양을 같이 비교해 보자", "바꾼 양으로 다시 계산했어", "이번 음료는 마신 기록에 넣지 않을게") [가설].
    만들지 않는 것: 카페인 의존이나 수면 장애 진단, 모두에게 같은 기준, 커피를 끊게 하는 기능, 수면 측정 기기·건강 앱 수면 데이터 연동(웹앱에서는 읽을 수 없음), 앱이 닫혀 있을 때의 위치 추적과 푸시 알림, 상세 수면 통계, 흡연·복용약 질문(수집 목적과 반영 규칙이 정해지지 않음).
